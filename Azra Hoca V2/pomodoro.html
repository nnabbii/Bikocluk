<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pomodoro Zamanlayıcı</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            color: #333;
            background-color: #fff; /* Normal mod için beyaz arka plan */
            transition: background-color 0.5s ease, color 0.5s ease;
            padding-top: 100px; 
            box-sizing: border-box;
            position: relative; /* Baloncukların doğru konumlanması için */
            overflow-x: hidden; /* Yatay taşmayı engelle */
        }

        body.night-mode {
            color: #f0f0f0;
            background-color: #1a1a1a; /* Karanlık mod için koyu arka plan */
        }

        /* Baloncuk Arka Plan Stilleri */
        .bubbles-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1; /* İçeriğin arkasında kalması için */
            overflow: hidden;
        }

        .bubbles-background span {
            position: absolute;
            bottom: -120px; 
            width: 40px;
            height: 40px;
            border-radius: 50%;
            animation: rise 20s infinite ease-in;
            opacity: 0;
            filter: blur(12px); /* Baloncuklara bulanıklık efekti */
            background-color: rgba(128, 0, 128, 0.35); /* Alfa değeri bulanıklıkla iyi görünmesi için ayarlandı */
        }

        /* Farklı boyut, pozisyon, süre ve MOR renklerde baloncuklar (Normal Mod) */
        .bubbles-background span:nth-child(1) { width: 80px; height: 80px; left: 10%; animation-duration: 18s; animation-delay: 0s; background-color: rgba(148, 0, 211, 0.4); }
        .bubbles-background span:nth-child(2) { width: 30px; height: 30px; left: 20%; animation-duration: 12s; animation-delay: 1.5s; background-color: rgba(153, 50, 204, 0.45); }
        .bubbles-background span:nth-child(3) { width: 50px; height: 50px; left: 30%; animation-duration: 20s; animation-delay: 2.5s; background-color: rgba(186, 85, 211, 0.35); }
        .bubbles-background span:nth-child(4) { width: 90px; height: 90px; left: 40%; animation-duration: 16s; animation-delay: 0.5s; background-color: rgba(128, 0, 128, 0.5); }
        .bubbles-background span:nth-child(5) { width: 35px; height: 35px; left: 50%; animation-duration: 13s; animation-delay: 1s; background-color: rgba(218, 112, 214, 0.4); }
        .bubbles-background span:nth-child(6) { width: 60px; height: 60px; left: 60%; animation-duration: 19s; animation-delay: 3s; background-color: rgba(147, 112, 219, 0.45); }
        .bubbles-background span:nth-child(7) { width: 25px; height: 25px; left: 70%; animation-duration: 11s; animation-delay: 0.2s; background-color: rgba(199, 21, 133, 0.35); }
        .bubbles-background span:nth-child(8) { width: 70px; height: 70px; left: 80%; animation-duration: 17s; animation-delay: 2s; background-color: rgba(221, 160, 221, 0.45); }
        .bubbles-background span:nth-child(9) { width: 45px; height: 45px; left: 90%; animation-duration: 14s; animation-delay: 0.8s; background-color: rgba(180, 80, 200, 0.42); }
        .bubbles-background span:nth-child(10) { width: 100px; height: 100px; left: 5%; animation-duration: 22s; animation-delay: 1.2s; background-color: rgba(160, 32, 240, 0.38); }
        .bubbles-background span:nth-child(11) { width: 55px; height: 55px; left: 25%; animation-duration: 15s; animation-delay: 3.5s; background-color: rgba(138, 43, 226, 0.41); }
        .bubbles-background span:nth-child(12) { width: 75px; height: 75px; left: 75%; animation-duration: 21s; animation-delay: 0.7s; background-color: rgba(177, 100, 220, 0.48); }

        /* Karanlık Mod için TURUNCU Baloncuk Renkleri */
        body.night-mode .bubbles-background span:nth-child(1) { background-color: rgba(255, 165, 0, 0.4); } /* Orange */
        body.night-mode .bubbles-background span:nth-child(2) { background-color: rgba(255, 140, 0, 0.45); }  /* Dark Orange */
        body.night-mode .bubbles-background span:nth-child(3) { background-color: rgba(255, 192, 70, 0.35); } /* Light Orange */
        body.night-mode .bubbles-background span:nth-child(4) { background-color: rgba(240, 178, 60, 0.5); } /* Gold-ish Orange */
        body.night-mode .bubbles-background span:nth-child(5) { background-color: rgba(255, 150, 50, 0.4); }
        body.night-mode .bubbles-background span:nth-child(6) { background-color: rgba(230, 160, 40, 0.45); }
        body.night-mode .bubbles-background span:nth-child(7) { background-color: rgba(255, 180, 80, 0.35); }
        body.night-mode .bubbles-background span:nth-child(8) { background-color: rgba(220, 140, 30, 0.45); }
        body.night-mode .bubbles-background span:nth-child(9) { background-color: rgba(250, 190, 85, 0.42); }
        body.night-mode .bubbles-background span:nth-child(10) { background-color: rgba(255, 130, 20, 0.38); }
        body.night-mode .bubbles-background span:nth-child(11) { background-color: rgba(245, 170, 65, 0.41); }
        body.night-mode .bubbles-background span:nth-child(12) { background-color: rgba(235, 155, 45, 0.48); }

        @keyframes rise {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 0; 
            }
            10% {
                opacity: 1; 
            }
            90% {
                opacity: 0.5; 
            }
            100% {
                transform: translateY(-120vh) rotate(720deg); 
                opacity: 0;
                bottom: 120vh; 
            }
        }

        /* Navbar Stilleri */
        .navbar {
            width: 100%;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1000; 
        }

        .navbar-container {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            max-width: 1200px; 
            margin: 0 auto;
            padding: 0 20px; 
            height: 80px;
        }

        .navbar-logo {
            display: flex; 
            align-items: center;
            height: 100%;
        }
        
        .navbar-logo a {
            display: inline-flex; 
            align-items: center;
            height: 100%;
        }
        
        .navbar-logo img {
            height: 160px;
            width: auto;
        }
        
        .navbar-links li a {
            display: flex;
            flex-direction: row;
            align-items: center;
            white-space: nowrap;
            gap: 0.4em;
        }

        .navbar-cta {
            margin-left: 20px;
        }

        .navbar-cta .cta-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            white-space: nowrap;
        }

        .page-main-title {
            font-size: 2.8rem;
            color: #333;
            text-align: center;
            margin-top: 30px;
            margin-bottom: 20px;
        }
        
        body.night-mode .page-main-title {
            color: #f0f0f0;
        }

        /* Pomodoro Container Stilleri */
        .pomodoro-container {
            text-align: center;
            background-color: rgba(255, 255, 255, 0.1);
            padding: 50px 60px;
            border-radius: 20px; 
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.15);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            margin-top: 20px;
            width: auto; 
            max-width: 800px;
            margin-left: auto;
            margin-right: auto;
        }

        body.night-mode .pomodoro-container {
            background-color: rgba(0, 0, 0, 0.25);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.35);
        }

        .timer-display {
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 30px 0;
        }

        .time {
            font-size: 10rem;
            font-weight: bold;
            line-height: 1;
            color: #333;
        }
        
        body.night-mode .time {
            color: #f0f0f0;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 30px;
        }

        .control-button {
            background-color: #6a1b9a;
            color: white;
            border: none;
            border-radius: 50px;
            padding: 15px 30px;
            font-size: 1.2rem;
            cursor: pointer;
            transition: background-color 0.3s, transform 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .control-button:hover {
            background-color: #8e24aa;
            transform: translateY(-2px);
        }

        .control-button:active {
            transform: translateY(0);
        }

        body.night-mode .control-button {
            background-color: #ff9800;
        }

        body.night-mode .control-button:hover {
            background-color: #ffa726;
        }

        .mode-buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 30px;
        }

        .mode-button {
            background-color: rgba(106, 27, 154, 0.2);
            color: #333;
            border: 2px solid #6a1b9a;
            border-radius: 30px;
            padding: 10px 20px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s;
        }

        .mode-button.active {
            background-color: #6a1b9a;
            color: white;
        }

        .mode-button:hover:not(.active) {
            background-color: rgba(106, 27, 154, 0.3);
        }

        body.night-mode .mode-button {
            background-color: rgba(255, 152, 0, 0.2);
            color: #f0f0f0;
            border-color: #ff9800;
        }

        body.night-mode .mode-button.active {
            background-color: #ff9800;
            color: #1a1a1a;
        }

        body.night-mode .mode-button:hover:not(.active) {
            background-color: rgba(255, 152, 0, 0.3);
        }

        .session-count {
            font-size: 1.2rem;
            margin-top: 20px;
            color: #555;
        }

        body.night-mode .session-count {
            color: #aaa;
        }

        #night-mode-toggle {
            position: fixed;
            top: 50%;
            left: 0;
            transform: translateY(-50%);
            font-size: 1.8rem;
            cursor: pointer;
            padding: 18px 15px 18px 20px;
            background-color: rgba(255, 255, 255, 0.7);
            color: #FFC107;
            border-top-right-radius: 30px;
            border-bottom-right-radius: 30px;
            border-top-left-radius: 0;
            border-bottom-left-radius: 0;
            width: auto;
            height: auto;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: background-color 0.3s ease, color 0.3s ease, transform 0.3s ease;
            z-index: 1001;
            box-shadow: 2px 0px 10px rgba(0,0,0,0.1);
        }
        
        #night-mode-toggle:hover {
            background-color: rgba(240, 240, 240, 0.9);
        }
        
        body.night-mode #night-mode-toggle {
            background-color: rgba(30, 30, 30, 0.7);
            color: #FFC107;
            box-shadow: 2px 0px 10px rgba(0,0,0,0.3);
        }
        
        body.night-mode #night-mode-toggle:hover {
            background-color: rgba(50, 50, 50, 0.9);
        }

        #fullscreen-toggle {
            position: fixed;
            bottom: 25px;
            right: 25px;
            font-size: 1.8rem;
            cursor: pointer;
            padding: 12px;
            background-color: rgba(0,0,0,0.08);
            color: #333;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: background-color 0.3s ease, transform 0.3s ease, color 0.3s ease;
            z-index: 1000;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }
        
        #fullscreen-toggle:hover {
            background-color: rgba(0,0,0,0.15);
            transform: scale(1.1);
        }
        
        body.night-mode #fullscreen-toggle {
            background-color: rgba(255,255,255,0.12);
            color: #f0f0f0;
            box-shadow: 0 2px 8px rgba(0,0,0,0.25);
        }
        
        body.night-mode #fullscreen-toggle:hover {
            background-color: rgba(255,255,255,0.2);
        }

        /* Navigasyon Çubuğu için Gece Modu Stilleri */
        body.night-mode .navbar {
            background-color: #1a1a1a;
            box-shadow: 0 2px 5px rgba(0,0,0,0.5);
        }
        
        body.night-mode .navbar-links li a {
            color: #cccccc;
        }
        
        body.night-mode .navbar-links li a:hover,
        body.night-mode .navbar-links li.dropdown-parent:hover > a {
            color: #ffffff;
            background-color: #333333;
        }
        
        body.night-mode .navbar-links .dropdown-menu {
            background-color: #2c2c2c;
            border-color: #444444;
        }
        
        body.night-mode .navbar-links .dropdown-menu li a {
            color: #bbbbbb;
        }
        
        body.night-mode .navbar-links .dropdown-menu li a:hover {
            color: #ffffff;
            background-color: #404040;
        }
        
        body.night-mode .navbar-cta .cta-button {
            background-color: #007bff;
            color: #ffffff;
            border: 1px solid #007bff;
        }
        
        body.night-mode .navbar-cta .cta-button:hover {
            background-color: #0056b3;
            border-color: #0056b3;
        }
        
        body.night-mode .navbar-links li a .fas {
            color: #cccccc;
        }
        
        body.night-mode .navbar-links li a:hover .fas {
            color: #ffffff;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            body {
                padding-top: 80px;
            }
            .navbar-container {
                height: 70px;
            }
            .navbar-logo img {
                height: 120px;
            }
            .page-main-title {
                font-size: 2.2rem;
                margin-top: 20px;
                margin-bottom: 15px;
            }
            .time {
                font-size: 7rem;
            }
            .pomodoro-container {
                padding: 35px 30px;
                margin-top: 15px;
                max-width: 90%;
            }
            .controls {
                flex-wrap: wrap;
            }
            .control-button {
                padding: 12px 24px;
                font-size: 1rem;
            }
            .mode-buttons {
                flex-wrap: wrap;
            }
            #night-mode-toggle {
                font-size: 1.5rem;
                padding: 15px 10px 15px 15px;
                border-top-right-radius: 25px;
                border-bottom-right-radius: 25px;
            }
        }
        
        @media (max-width: 480px) {
            body {
                padding-top: 70px;
            }
            .navbar-container {
                height: 60px;
            }
            .navbar-logo img {
                height: 100px;
            }
            .page-main-title {
                font-size: 1.8rem;
                margin-top: 15px;
                margin-bottom: 10px;
            }
            .time {
                font-size: 4.5rem;
            }
            .pomodoro-container {
                padding: 25px 15px;
            }
            .control-button {
                padding: 10px 20px;
                font-size: 0.9rem;
            }
            #night-mode-toggle {
                font-size: 1.3rem;
                padding: 12px 8px 12px 10px;
                border-top-right-radius: 20px;
                border-bottom-right-radius: 20px;
            }
        }
    </style>
</head>

    <h1 class="page-main-title">Pomodoro Zamanlayıcı</h1>

    <div class="pomodoro-container">
        <div class="mode-buttons">
            <button class="mode-button active" data-mode="pomodoro">Çalışma</button>
            <button class="mode-button" data-mode="shortBreak">Kısa Mola</button>
            <button class="mode-button" data-mode="longBreak">Uzun Mola</button>
        </div>
        
        <div class="timer-display">
            <div class="time" id="time">25:00</div>
        </div>
        
        <div class="controls">
            <button class="control-button" id="start-btn">
                <i class="fas fa-play"></i> Başlat
            </button>
            <button class="control-button" id="pause-btn" disabled>
                <i class="fas fa-pause"></i> Duraklat
            </button>
            <button class="control-button" id="reset-btn">
                <i class="fas fa-redo-alt"></i> Sıfırla
            </button>
        </div>
        
        <div class="session-count">
            Tamamlanan Pomodoro: <span id="session-count">0</span>
        </div>
    </div>

    <!-- Gece Modu Düğmesi -->
    <div id="night-mode-toggle" class="fas fa-moon" title="Gece Modu"></div>
    
    <!-- Tam Ekran Düğmesi -->
    <div id="fullscreen-toggle" title="Tam Ekran">
        <i class="fas fa-expand"></i>
    </div>

    <script>
        // DOM Elementleri
        const timeDisplay = document.getElementById('time');
        const startBtn = document.getElementById('start-btn');
        const pauseBtn = document.getElementById('pause-btn');
        const resetBtn = document.getElementById('reset-btn');
        const sessionCountDisplay = document.getElementById('session-count');
        const modeButtons = document.querySelectorAll('.mode-button');
        const nightModeToggle = document.getElementById('night-mode-toggle');
        const fullscreenToggle = document.getElementById('fullscreen-toggle');
        const body = document.body;
        
        // Pomodoro Ayarları
        const settings = {
            pomodoro: 25 * 60, // 25 dakika
            shortBreak: 5 * 60, // 5 dakika
            longBreak: 15 * 60, // 15 dakika
        };
        
        // Durum Değişkenleri
        let currentMode = 'pomodoro';
        let timeLeft = settings[currentMode];
        let timerInterval = null;
        let isRunning = false;
        let sessionCount = 0;
        
        // Zamanı Biçimlendirme Fonksiyonu
        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = seconds % 60;
            return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        }
        
        // Zamanlayıcıyı Güncelleme Fonksiyonu
        function updateTimer() {
            timeLeft--;
            
            if (timeLeft < 0) {
                clearInterval(timerInterval);
                timerComplete();
                return;
            }
            
            timeDisplay.textContent = formatTime(timeLeft);
            document.title = `${formatTime(timeLeft)} - Pomodoro Zamanlayıcı`;
        }
        
        // Zamanlayıcı Tamamlandığında
        function timerComplete() {
            const audio = new Audio('https://soundbible.com/grab.php?id=1746&type=mp3');
            audio.play();
            
            if (currentMode === 'pomodoro') {
                sessionCount++;
                sessionCountDisplay.textContent = sessionCount;
                
                // 4 pomodoro sonrası uzun mola, aksi takdirde kısa mola
                if (sessionCount % 4 === 0) {
                    switchMode('longBreak');
                } else {
                    switchMode('shortBreak');
                }
            } else {
                // Mola sonrası pomodoro'ya dön
                switchMode('pomodoro');
            }
            
            startTimer(); // Otomatik olarak sonraki modu başlat
        }
        
        // Zamanlayıcıyı Başlatma Fonksiyonu
        function startTimer() {
            if (isRunning) return;
            
            isRunning = true;
            startBtn.disabled = true;
            pauseBtn.disabled = false;
            
            timerInterval = setInterval(updateTimer, 1000);
        }
        
        // Zamanlayıcıyı Duraklatma Fonksiyonu
        function pauseTimer() {
            if (!isRunning) return;
            
            isRunning = false;
            clearInterval(timerInterval);
            startBtn.disabled = false;
            pauseBtn.disabled = true;
        }
        
        // Zamanlayıcıyı Sıfırlama Fonksiyonu
        function resetTimer() {
            pauseTimer();
            timeLeft = settings[currentMode];
            timeDisplay.textContent = formatTime(timeLeft);
            document.title = 'Pomodoro Zamanlayıcı';
        }
        
        // Modu Değiştirme Fonksiyonu
        function switchMode(mode) {
            if (mode === currentMode) return;
            
            currentMode = mode;
            timeLeft = settings[mode];
            timeDisplay.textContent = formatTime(timeLeft);
            document.title = 'Pomodoro Zamanlayıcı';
            
            // Aktif mod düğmesini güncelle
            modeButtons.forEach(btn => {
                if (btn.dataset.mode === mode) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });
            
            // Eğer zamanlayıcı çalışıyorsa, durdur ve sıfırla
            if (isRunning) {
                pauseTimer();
                resetTimer();
            }
        }
        
        // Gece Modunu Değiştirme Fonksiyonu
        function toggleNightMode() {
            body.classList.toggle('night-mode');
            
            // İkonu güncelle
            if (body.classList.contains('night-mode')) {
                nightModeToggle.classList.remove('fa-moon');
                nightModeToggle.classList.add('fa-sun');
                localStorage.setItem('theme', 'night-mode');
            } else {
                nightModeToggle.classList.remove('fa-sun');
                nightModeToggle.classList.add('fa-moon');
                localStorage.setItem('theme', 'light-mode');
            }
        }
        
        // Tam Ekran Modunu Değiştirme Fonksiyonu
        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    console.error(`Tam ekran hatası: ${err.message}`);
                });
                fullscreenToggle.innerHTML = '<i class="fas fa-compress"></i>';
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                    fullscreenToggle.innerHTML = '<i class="fas fa-expand"></i>';
                }
            }
        }
        
        // Sayfa Yüklendiğinde Kayıtlı Temayı Kontrol Et
        document.addEventListener('DOMContentLoaded', () => {
            if (localStorage.getItem('theme') === 'night-mode') {
                body.classList.add('night-mode');
                nightModeToggle.classList.remove('fa-moon');
                nightModeToggle.classList.add('fa-sun');
            }
            
            // Zamanlayıcıyı başlangıç değerine ayarla
            timeDisplay.textContent = formatTime(timeLeft);
        });
        
        // Olay Dinleyicileri
        startBtn.addEventListener('click', startTimer);
        pauseBtn.addEventListener('click', pauseTimer);
        resetBtn.addEventListener('click', resetTimer);
        
        modeButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                switchMode(btn.dataset.mode);
            });
        });
        
        nightModeToggle.addEventListener('click', toggleNightMode);
        fullscreenToggle.addEventListener('click', toggleFullscreen);
        
        // Tam ekran değişikliğini dinle
        document.addEventListener('fullscreenchange', () => {
            if (!document.fullscreenElement) {
                fullscreenToggle.innerHTML = '<i class="fas fa-expand"></i>';
            } else {
                fullscreenToggle.innerHTML = '<i class="fas fa-compress"></i>';
            }
        });
        
        // Başlangıçta zamanlayıcıyı ayarla
        resetTimer();
    </script>
</body>
</html>
